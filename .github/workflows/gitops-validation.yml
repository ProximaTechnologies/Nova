name: GitOps validation

on:
  pull_request:
    paths:
      - 'gitops/**'
      - '.github/workflows/gitops-validation.yml'
  push:
    branches: [main]
    paths:
      - 'gitops/**'
      - '.github/workflows/gitops-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r gitops/scripts/requirements-validation.txt
      - name: Validate manifests and repository references
        run: gitops/scripts/validate-gitops.sh
      - name: Check shell syntax
        run: |
          for script in gitops/bootstrap.sh gitops/argo-cfg/*.sh gitops/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Test validation and bootstrap without a cluster
        run: |
          python -m unittest discover -s gitops/scripts -p 'test_*.py' -v
          python -m unittest discover -s gitops/tests -v
