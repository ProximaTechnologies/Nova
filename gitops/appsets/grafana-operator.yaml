apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: grafana-operator-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      labels:
        app.kubernetes.io/name: grafana-operator
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: ghcr.io/grafana/helm-charts
          chart: grafana-operator
          targetRevision: 5.23.0
          helm:
            releaseName: grafana-operator
            valueFiles:
              - $values/gitops/env/{{env}}/grafana-operator.yaml
        - repoURL: https://github.com/ProximaTechnologies/Nova.git
          targetRevision: main
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: grafana-operator
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
