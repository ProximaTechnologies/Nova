apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: forgejo-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "30"
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: code.forgejo.org/forgejo-helm
          chart: forgejo
          targetRevision: 17.1.0
          helm:
            releaseName: forgejo
            valueFiles:
              - $values/gitops/env/{{env}}/forgejo.yaml
        - repoURL: https://github.com/ProximaTechnologies/Nova.git
          targetRevision: main
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: forgejo
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
