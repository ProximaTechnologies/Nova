apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dragonfly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: dragonfly-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      labels:
        app.kubernetes.io/name: dragonfly
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: ghcr.io/dragonflydb/dragonfly-operator/helm
          chart: dragonfly-operator
          targetRevision: v1.5.0
          helm:
            releaseName: dragonfly
            valueFiles:
              - $values/gitops/env/{{env}}/dragonfly.yaml
        - repoURL: https://github.com/ProximaTechnologies/Nova.git
          targetRevision: main
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: dragonfly
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
