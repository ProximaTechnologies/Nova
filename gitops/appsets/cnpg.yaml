apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: cnpg-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      labels:
        app.kubernetes.io/name: cnpg
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: https://cloudnative-pg.github.io/charts
          chart: cloudnative-pg
          targetRevision: 0.28.2
          helm:
            releaseName: cnpg
            valueFiles:
              - $values/gitops/env/{{env}}/cnpg.yaml
        - repoURL: "https://github.com/ProximaTechnologies/Nova.git"
          targetRevision: "codex/oci-bootstrap-test-20261121"
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: cnpg
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
