apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: sealed-secrets-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      labels:
        app.kubernetes.io/name: sealed-secrets
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: https://bitnami.github.io/sealed-secrets
          chart: sealed-secrets
          targetRevision: 2.18.6
          helm:
            releaseName: sealed-secrets
            valueFiles:
              - $values/gitops/env/{{env}}/sealed-secrets.yaml
        - repoURL: "https://github.com/ProximaTechnologies/Nova.git"
          targetRevision: "codex/oci-bootstrap-test-20261121"
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: sealed-secrets
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
