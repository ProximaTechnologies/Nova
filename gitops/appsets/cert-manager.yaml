apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  generators:
    - list:
        elements:
          - env: dev
            cluster: dev
            project: nova-dev
  template:
    metadata:
      name: cert-manager-{{env}}
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/part-of: nova
        nova.proxima.dev/environment: "{{env}}"
    spec:
      project: "{{project}}"
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.20.2
          helm:
            releaseName: cert-manager
            valueFiles:
              - $values/gitops/env/{{env}}/cert-manager.yaml
        - repoURL: https://github.com/ProximaTechnologies/Nova.git
          targetRevision: main
          ref: values
      destination:
        name: "{{cluster}}"
        namespace: cert-manager
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
