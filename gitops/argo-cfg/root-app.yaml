apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-appsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/ProximaTechnologies/Nova.git"
    targetRevision: "codex/oci-bootstrap-test-20261121"
    path: gitops/appsets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 6
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
