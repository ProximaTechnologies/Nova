fullnameOverride: sealed-secrets-controller
namespace: sealed-secrets

secretName: sealed-secrets-key

image:
  tag: 0.37.0

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

rbac:
  create: true
  clusterRole: true
  serviceProxier:
    create: false
    bind: false

metrics:
  serviceMonitor:
    enabled: false
  dashboards:
    create: false

pdb:
  create: false
