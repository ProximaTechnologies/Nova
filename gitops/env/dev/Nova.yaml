ingress:
  host: nova.domain.com
  ingressClassName: apisix

cfg:
  image:
    registry: ghcr.io
    image: proximatechnologies/novacfg
    tag: latest
    imagePullPolicy: IfNotPresent
  env:
    - name: REDIS_URL
      value: "dragonfly-ha.dragonfly-prod.svc.cluster.local:6379"
    - name: NOVAUI_URL
      value: "http://nova-ui-nova-service.nova.svc.cluster.local"
    - name: NOVAUI_CONFIG_REFRESH_TOKEN
      valueFrom:
        secretKeyRef:
          name: nova-ui-runtime
          key: NOVACFG_CONFIG_REFRESH_TOKEN
    - name: MIMIR_URL
      value: "https://mimir.domain.com/api/v1/push"
    - name: LOKI_URL
      value: "https://loki.domain.com/loki/api/v1/push"
    - name: NO_TLS_VERIFY
      value: "True"

postgres:
  name: nova-db
  certManager:
    enabled: false

ui:
  image:
    registry: ghcr.io
    image: proximatechnologies/novaui
    tag: latest
    imagePullPolicy: IfNotPresent
  env:
    - name: DJANGO_SETTINGS_MODULE
      value: "NovaUI.settings"
    - name: NOVA_ENV
      value: "development"
    - name: DEBUG
      value: "true"
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: nova-ui-runtime
          key: SECRET_KEY
    - name: ALLOWED_HOSTS
      value: "nova.domain.com,nova-ui-nova-service,nova-ui-nova-service.nova.svc,nova-ui-nova-service.nova.svc.cluster.local,localhost,127.0.0.1"
    - name: CSRF_TRUSTED_ORIGINS
      value: "http://nova.domain.com,https://nova.domain.com"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: nova-ui-runtime
          key: DATABASE_URL
    - name: REDIS_URL
      value: "redis://dragonfly-ha.dragonfly-prod.svc.cluster.local:6379/0"
    - name: CONFIGURATION_URL
      value: "https://cfg.domain.com"
    - name: UI_URL
      value: "https://nova.domain.com"
    - name: NOVACFG_CONFIG_REFRESH_TOKEN
      valueFrom:
        secretKeyRef:
          name: nova-ui-runtime
          key: NOVACFG_CONFIG_REFRESH_TOKEN
    - name: GRAFANA_PROTOCOL
      value: "http"
    - name: GRAFANA_HOST
      value: "nova-grafana-service.nova.svc.cluster.local:3000"
    - name: GRAFANA_EXTERNAL_URL
      value: "https://grafana.domain.com"
    - name: GRAFANA_USER
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: GF_SECURITY_ADMIN_USER
    - name: GRAFANA_PASSWORD
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: GF_SECURITY_ADMIN_PASSWORD
    - name: GRAFANA_OAUTH_CLIENT_NAME
      value: "Grafana OAuth"
    - name: GRAFANA_OAUTH_TLS_SKIP_VERIFY_INSECURE
      value: "true"
    - name: NOVA_PUBLIC_URL
      value: "https://nova.domain.com"
    - name: NOVA_OIDC_ISSUER_URL
      value: "https://nova.domain.com"
    - name: NODE_TOKEN_TTL_MINUTES
      value: "10"
    - name: DASHBOARD_WEBSOCKET_REFRESH_SECONDS
      value: "5"
    - name: CELERY_BROKER_URL
      value: "redis://dragonfly-ha.dragonfly-prod.svc.cluster.local:6379/0"
    - name: CELERY_BACKEND
      value: "redis://dragonfly-ha.dragonfly-prod.svc.cluster.local:6379/0"
    - name: GITOPS_REPO_PATH
      value: ""
    - name: GITOPS_MANIFEST_ROOT
      value: "novaui"
    - name: GITOPS_AUTO_COMMIT
      value: "true"
    - name: GITOPS_AUTO_PUSH
      value: "true"
    - name: GITOPS_COMMIT_AUTHOR_NAME
      value: "NovaUI"
    - name: GITOPS_COMMIT_AUTHOR_EMAIL
      value: "novaui@localhost"
    - name: GITOPS_PLUGINS
      value: "config.gitops.plugins.grafana.GrafanaOperatorPlugin,config.gitops.plugins.apisix.APISIXPlugin"
    - name: GITOPS_GRAFANA_NAMESPACE
      value: "nova"
    - name: GITOPS_GRAFANA_INSTANCE_LABEL_KEY
      value: "dashboards"
    - name: GITOPS_GRAFANA_ADMIN_SECRET_NAME
      value: "grafana-admin-credentials"
    - name: GITOPS_GRAFANA_ADMIN_USER_KEY
      value: "GF_SECURITY_ADMIN_USER"
    - name: GITOPS_GRAFANA_ADMIN_PASSWORD_KEY
      value: "GF_SECURITY_ADMIN_PASSWORD"
    - name: GITOPS_GRAFANA_RESYNC_PERIOD
      value: "10m"
    - name: GITOPS_MIMIR_DATASOURCE_URL
      value: "http://mimir-gateway.mimir.svc/prometheus"
    - name: GITOPS_LOKI_DATASOURCE_URL
      value: "http://loki-gateway.loki.svc"
    - name: GITOPS_APISIX_NAMESPACE
      value: "apisix"
    - name: GITOPS_APISIX_INGRESS_CLASS
      value: "apisix"
    - name: GITOPS_KUBESEAL_BINARY
      value: "/usr/local/bin/kubeseal"
    - name: GITOPS_SEALED_SECRETS_CERT_FILE
      value: "/tmp/sealed-secrets-public.pem"
    - name: GITOPS_SEALED_SECRETS_CERT_URL
      value: "http://sealed-secrets-controller.sealed-secrets.svc:8080/v1/cert.pem"
    - name: GITOPS_SEALED_SECRETS_SCOPE
      value: "strict"
    - name: GITOPS_FORGEJO_ENABLED
      value: "true"
    - name: GITOPS_FORGEJO_URL
      value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
    - name: GITOPS_FORGEJO_USERNAME
      valueFrom:
        secretKeyRef:
          name: forgejo-admin
          key: username
    - name: GITOPS_FORGEJO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: forgejo-admin
          key: password
    - name: GITOPS_FORGEJO_ORG
      value: "nova"
    - name: GITOPS_FORGEJO_DEFAULT_BRANCH
      value: "main"
    - name: GITOPS_FORGEJO_REPO_PRIVATE
      value: "true"
    - name: GITOPS_FORGEJO_TIMEOUT_SECONDS
      value: "10"
    - name: GITOPS_FORGEJO_SSL_VERIFY
      value: "true"
    - name: GITOPS_FORGEJO_NOVA_REPO_NAME
      value: "nova"
    - name: GITOPS_FORGEJO_CUSTOM_REPO_SUFFIX
      value: "custom"
    - name: NOVA_AGENT_INSECURE_TLS
      value: "true"
dragonfly:
  # Fit the single-node development cluster; leave headroom for snapshots.
  maxmemory: 512mb
  storageClass: "standard"
  storage: "1Gi"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  auth:
    enabled: false
  tls:
    enabled: false

grafana:
  config:
    auth.generic_oauth:
      tls_skip_verify_insecure: "true"

apisixRoute:
  enabled: true
  tls:
    enabled: true
    secretName: "domain-com-wildcard-tls"
    secretNamespace: "nova"
  ui:
    enabled: true
    host: "nova.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    websocket:
      enabled: true
      paths:
        - "/ws/*"
      priority: 10
  cfg:
    enabled: true
    host: "cfg.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
  mimir:
    enabled: true
    host: "mimir.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    serviceName: "nova-mimir-gateway"
    servicePort: 80
    externalName: "mimir-gateway.mimir.svc.cluster.local"
    pluginConfig:
      name: "nova-mimir-auth"
      namespace: "apisix"
  loki:
    enabled: true
    host: "loki.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    serviceName: "nova-loki-gateway"
    servicePort: 80
    externalName: "loki-gateway.loki.svc.cluster.local"
    pluginConfig:
      name: "nova-loki-auth"
      namespace: "apisix"
  grafana:
    enabled: true
    host: "grafana.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    serviceName: "nova-grafana-service"
    servicePort: 3000
