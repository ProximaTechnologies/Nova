deploymentMode: Monolithic

test:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
  useTestSchema: true

singleBinary:
  replicas: 1

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

gateway:
  ingress:
    enabled: false
    ingressClassName: apisix
    hosts:
      - host: loki.domain.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
